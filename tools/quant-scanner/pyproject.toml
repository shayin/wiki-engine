[project]
name = "quant-scanner"
version = "0.1.0"
description = "美股短线/中线量化扫描器 — VCP / Trend Template / CAN SLIM 信号系统，与 wiki-research + 透镜体系整合"
requires-python = ">=3.10"
authors = [{ name = "shayin" }]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "pandas-ta>=0.3.14b",
    "requests>=2.31",
    "jinja2>=3.1",
    "click>=8.1",
    "rich>=13.7",
    "pyarrow>=15.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
backtest = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
quant-scanner = "quant_scanner.scanner.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
